name: mpltyop
description: "MPLTYOP - Ad-free YouTube Music streaming for Android"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # YouTube Music API (on-device via Chaquopy)
  yt_flutter_musicapi:
    git:
      url: https://github.com/golanpiyush/yt_flutter_musicapi.git
      ref: main

  # Playback (compatible with Dart 3.4.3 / Flutter 3.22.2)
  just_audio: ^0.9.36
  audio_service: ^0.18.9
  just_audio_background: ^0.0.1-beta.11

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.0
  uuid: ^4.4.0
  dartz: ^0.10.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
