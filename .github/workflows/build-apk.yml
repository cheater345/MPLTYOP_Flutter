name: Build MPLTYOP APK

on:
  push:
    branches: [main]
    paths:
      - 'mpltyop_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk" >> $GITHUB_ENV

      - name: Generate Android project skeleton
        run: |
          cd mpltyop_flutter
          rm -rf android
          flutter create . --platforms android
          echo "=== Generated build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== Generated app build.gradle ==="
          cat android/app/build.gradle

      - name: Write project build.gradle with Chaquopy
        run: |
          cd mpltyop_flutter
          cat android/build.gradle

      - name: Apply Chaquopy to build.gradle files
        run: |
          cd mpltyop_flutter
          
          # Update project build.gradle: add Chaquopy maven repo + classpath
          cat android/build.gradle
          
          # Add Chaquopy to project build.gradle
          sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://chaquo.com/maven" }|' android/build.gradle
          sed -i '/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:/a\        classpath "com.chaquo.python:gradle:12.0.0"' android/build.gradle
          
          echo "=== Modified project build.gradle ==="
          cat android/build.gradle
          
          # Add Chaquopy plugin to app build.gradle (add after com.android.application)
          sed -i '/apply plugin: '\''com.android.application'\''/a apply plugin: '\''com.chaquo.python'\''' android/app/build.gradle
          
          # Add Chaquopy python config using python
          python3 << 'PYEOF'
with open('android/app/build.gradle', 'r') as f:
    content = f.read()

# Add Chaquopy python block after namespace
content = content.replace(
    'namespace "com.cheater345.mpltyop"',
    '''namespace "com.cheater345.mpltyop"

    python {
        version "3.11"
        buildType "release"
        pip {
            install "ytmusicapi==1.8.0"
            install "yt-dlp==2024.1.2"
            install "requests==2.31.0"
        }
    }'''
)

# Ensure multidex
if 'multidex' not in content:
    content = content.replace(
        'implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"',
        'implementation "androidx.multidex:multidex:2.0.1"\n    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"'
    )

with open('android/app/build.gradle', 'w') as f:
    f.write(content)
print("Done")
PYEOF
          
          echo "=== Modified app build.gradle ==="
          cat android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get
        working-directory: mpltyop_flutter

      - name: Build APK
        run: |
          cd mpltyop_flutter
          flutter build apk --release --split-per-abi -v 2>&1 | tail -50

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpltyop-apks
          path: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Release APK
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
