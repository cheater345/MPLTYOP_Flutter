name: Test Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Basic Flutter Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Show Flutter doctor
        run: flutter doctor -v
      - name: Create test app
        run: |
          flutter create test_app --platforms android
          cd test_app
          flutter pub get
          flutter build apk --release
        working-directory: /root/MPLTYOP_Flutter
