name: Build MPLTYOP APK

on:
  push:
    branches: [main]
    paths:
      - 'mpltyop_flutter/**'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk" >> $GITHUB_ENV

      - name: Setup Android project with Chaquopy
        run: bash ../scripts/setup_android.sh

      - name: Get dependencies
        run: flutter pub get
        working-directory: mpltyop_flutter

      - name: Build APK
        run: |
          cd mpltyop_flutter
          flutter build apk --release --split-per-abi -v 2>&1 | tail -80

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpltyop-apks
          path: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Release APK
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
