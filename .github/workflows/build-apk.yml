name: Build MPLTYOP APK

on:
  push:
    branches: [main]
    paths:
      - 'mpltyop_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Generate Android project files
        run: |
          cd mpltyop_flutter
          # Remove android dir to get clean generated files
          rm -rf android
          flutter create . --platforms android
          echo "=== Android dir structure ==="
          find android -name "*.gradle" -o -name "gradlew" -o -name "*.kt" | sort

      - name: Apply Chaquopy + custom Android config
        run: |
          cd mpltyop_flutter
          
          # 1. Add Chaquopy to project build.gradle
          sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://chaquo.com/maven" }|' android/build.gradle
          sed -i '/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:/a\        classpath "com.chaquo.python:gradle:12.4.0"' android/build.gradle
          
          # 2. Add Chaquopy plugin to app build.gradle
          sed -i '1s|apply plugin: '\''com.android.application'\''|apply plugin: '\''com.android.application'\''\napply plugin: '\''com.chaquo.python'\''|' android/app/build.gradle
          
          # 3. Add Chaquopy config and dependencies using python
          python3 << 'PYEOF'
import re

with open('android/app/build.gradle', 'r') as f:
    content = f.read()

# Add Chaquopy python config after namespace line
content = content.replace(
    'namespace "com.cheater345.mpltyop"',
    'namespace "com.cheater345.mpltyop"\n\n    python {\n        version "3.11"\n        buildType "release"\n        pip {\n            install "ytmusicapi==1.8.0"\n            install "yt-dlp==2024.1.2"\n            install "requests==2.31.0"\n        }\n    }'
)

# Add multidex dependency
content = content.replace(
    'implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"',
    'implementation "androidx.multidex:multidex:2.0.1"\n    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"'
)

with open('android/app/build.gradle', 'w') as f:
    f.write(content)

print('Chaquopy + deps added')
PYEOF

      - name: Get dependencies
        run: flutter pub get
        working-directory: mpltyop_flutter

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: mpltyop_flutter

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpltyop-apks
          path: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Release APK
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
