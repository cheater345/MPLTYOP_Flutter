name: Minimal Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true
      - name: Run flutter doctor
        run: flutter doctor -v
      - name: Test flutter create
        run: flutter create test_app --platforms android
      - name: Build test app
        run: cd test_app && flutter build apk --release
      - name: Check mpltyop_flutter exists
        run: ls -la mpltyop_flutter/
      - name: Try flutter pub get on mpltyop_flutter
        run: flutter pub get
        working-directory: mpltyop_flutter
