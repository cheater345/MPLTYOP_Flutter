name: Test Flutter Doctor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Flutter Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Run flutter doctor
        run: flutter doctor -v
      - name: Check Java
        run: java -version
      - name: Check Android SDK
        run: ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME not set"
