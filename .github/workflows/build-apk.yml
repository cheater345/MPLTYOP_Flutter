name: Build MPLTYOP APK

on:
  push:
    branches: [main]
    paths:
      - 'mpltyop_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Remove existing Android dir to avoid conflicts
        run: rm -rf mpltyop_flutter/android

      - name: Generate Android project files
        run: flutter create . --platforms android
        working-directory: mpltyop_flutter

      - name: Add Chaquopy to project build.gradle
        run: |
          cd mpltyop_flutter
          sed -i '/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:/a\        classpath "com.chaquo.python:gradle:16.0.0"' android/build.gradle
          sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://chaquo.com/maven' }|" android/build.gradle
          sed -i "1s;^;apply plugin: 'com.chaquo.python'\n" android/app/build.gradle
          
          # Add Chaquopy config to android block
          sed -i '/namespace/a\    python {\n        version "3.11"\n        buildType "release"\n        pip {\n            install "ytmusicapi==1.8.0"\n            install "yt-dlp==2024.1.2"\n            install "requests==2.31.0"\n        }\n    }' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get
        working-directory: mpltyop_flutter

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: mpltyop_flutter

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpltyop-apks
          path: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Release APK
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
