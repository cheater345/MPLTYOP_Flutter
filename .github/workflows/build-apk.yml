name: Build MPLTYOP APK

on:
  push:
    branches: [main]
    paths:
      - 'mpltyop_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Setup Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk" >> $GITHUB_ENV

      - name: Patch yt_flutter_musicapi plugin
        run: |
          PLUGIN_DIR=$(find /home/runner/.pub-cache/git/ -maxdepth 1 -name "yt_flutter_musicapi-*" 2>/dev/null | head -1)
          echo "Plugin dir: $PLUGIN_DIR"
          if [ -n "$PLUGIN_DIR" ]; then
            sed -i '/buildPython/d' "$PLUGIN_DIR/android/build.gradle"
            echo "Plugin patched"
          fi

      - name: Build APK
        run: |
          cd mpltyop_flutter
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release 2>&1 | tee build.log; EXIT=${PIPESTATUS[0]}; if [ $EXIT -ne 0 ]; then echo "BUILD FAILED"; cat build.log | grep -E "What went wrong|Caused by|error:|e:|FAILED|Exception|Execution failed" | head -20; exit 1; fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpltyop-apks
          path: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Release APK
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mpltyop_flutter/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
