name: Debug Pub Get

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true
      - name: Run flutter doctor
        run: flutter doctor -v
      - name: Try flutter pub get in root
        run: flutter pub get
      - name: Try flutter pub get in mpltyop_flutter
        run: flutter pub get
        working-directory: mpltyop_flutter
