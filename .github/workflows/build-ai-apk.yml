name: Build AI Coding Assistant APK

on:
  push:
    paths:
      - 'ai-coding-assistant/**'
      - '.github/workflows/build-ai-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('ai-coding-assistant/**/*.gradle.kts', 'ai-coding-assistant/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ai-coding-assistant
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors if build failed
        if: failure()
        working-directory: ai-coding-assistant
        run: |
          grep -E "error:|FAILURE:|Caused by:" build.log | head -50 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-coding-assistant-apks
          path: ai-coding-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
